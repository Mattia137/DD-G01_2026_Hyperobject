<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DD-G01 HYPEROBJECT — Documentation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bar{position:sticky;top:0;display:flex;gap:16px;align-items:center;padding:10px 24px;border-bottom:1px solid #d0d7de;background:#f6f8fa;font-size:14px;z-index:2}
  .bar a{color:#0969da;text-decoration:none}.bar a:hover{text-decoration:underline}
  .bar b{margin-right:auto}
  .markdown-body{box-sizing:border-box;max-width:1012px;margin:0 auto;padding:32px 24px 64px}
</style>
</head>
<body>
<div class="bar"><b>DD-G01 HYPEROBJECT</b><a href="doc.html">README</a><a href="doc.html?f=docs/METHODOLOGY.md">Methodology</a><a href="./">← Back to the tool</a></div>
<article class="markdown-body" id="doc">Loading…</article>
<script>
const f = new URLSearchParams(location.search).get('f') || 'README.md';
const base = f.includes('/') ? f.slice(0, f.lastIndexOf('/') + 1) : '';
const doc = document.getElementById('doc');
fetch('../' + f).then(r => { if (!r.ok) throw 0; return r.text(); }).then(md => {
  doc.innerHTML = marked.parse(md);
  doc.querySelectorAll('img').forEach(i => { const s = i.getAttribute('src'); if (s && !/^(https?:|data:|\/)/.test(s)) i.src = '../' + base + s; });
  doc.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href'); if (/^(https?:|#|mailto:)/.test(h)) return;
    const p = new URL(base + h, 'http://x/').pathname.slice(1);
    a.href = p.endsWith('.md') ? 'doc.html?f=' + p : '../' + p;
  });
  document.title = (doc.querySelector('h1')?.textContent || 'Documentation') + ' — DD-G01 HYPEROBJECT';
}).catch(() => { doc.innerHTML = '<p>Documentation file not found: ' + f + '</p>'; });
</script>
</body>
</html>
